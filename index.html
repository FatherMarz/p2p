    <noscript>
      <h1>P2P File — send a file browser-to-browser with a one-time passphrase</h1>
      <p>
        P2P File sends a file straight from one browser to another over a
        peer-to-peer WebRTC connection. Pick a file and get a three-word
        passphrase; the other person types it into this same page and
        accepts. Our server only relays the small handshake notes the two
        browsers need to find each other — the file itself never passes
        through it, is never uploaded, and is never stored. The connection
        is end-to-end encrypted (DTLS). Desktop Chrome, Edge and Brave can
        receive files up to 16GB; Firefox, Safari and mobile browsers are
        capped at 250MB because they must hold the file in memory. Each
        passphrase works once, expires after a few minutes if unused, and
        both tabs must stay open for the transfer to complete. This page
        requires JavaScript to run the file transfer.
      </p>
